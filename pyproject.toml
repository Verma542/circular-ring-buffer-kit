[project]
name = "circular-ring-buffer-kit"
version = "0.1.3"
description = "In-memory ring buffer over collections.deque that keeps recent log records queryable by level and time range."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
